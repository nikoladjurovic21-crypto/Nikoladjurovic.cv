<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-24 -24 1048 648" width="1572" height="972"><style>text{font-family:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.dg-zone{fill:#faf9ff;stroke:#ddd5fb;stroke-width:1.2;stroke-dasharray:5 5}.dg-z{font-size:11px;font-weight:700;letter-spacing:.09em;fill:#6d4aff}
.dg-box{fill:#fff;stroke:#cfc8ee;stroke-width:1.3}.dg-muted{fill:#f4f4f7;stroke:#d6d6df}.dg-ext{fill:#eefaf5;stroke:#9fdcc4}.dg-store{fill:#fffaf0;stroke:#ecd9a6}
.dg-t{font-weight:700;fill:#0e0e12;text-anchor:middle}.dg-s{font-size:12px;fill:#55546a;text-anchor:middle}
.dg-a{fill:none;stroke:#6d4aff;stroke-width:1.6}.dg-dash{stroke-dasharray:6 5;stroke:#8f7ae6}
.dg-l{font-size:11.5px;font-weight:600;fill:#3b2a8a;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round}
.dg-note{font-size:11px;font-style:italic;fill:#6b6a80;text-anchor:middle;paint-order:stroke;stroke:#fff;stroke-width:4px}
.dg-life{stroke:#cfc8ee;stroke-width:1.2;stroke-dasharray:4 5}.dg-frame{fill:rgb(109 74 255 / .04);stroke:#b9abf5;stroke-width:1.2}.dg-frame-tag{fill:#ece7ff}.dg-ft{font-size:11px;font-weight:700;fill:#5a38e6}</style><rect x="-24" y="-24" width="1048" height="648" fill="#ffffff"/><title id="dgSeqT">Sequence for converting one price: the pointer rests on a forint price, content.js hit-tests it and asks the overlay to show the Convert to pill, the user picks euro, the overlay asks the background script for HUF rates, the background reads its cached euro table and, if it is older than an hour, fetches the daily euro table from Frankfurter and saves it, then returns the cross rates with date and source, and the overlay shows the amount.</title><defs><marker id="dgAr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6d4aff"/></marker><marker id="dgArS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6d4aff"/></marker></defs><line class="dg-life" x1="80" y1="62" x2="80" y2="590"/><rect class="dg-box dg-muted" x="18" y="18" width="124" height="44" rx="10"/><text class="dg-t" x="80" y="45" font-size="14">You</text><line class="dg-life" x1="255" y1="62" x2="255" y2="590"/><rect class="dg-box" x="193" y="18" width="124" height="44" rx="10"/><text class="dg-t" x="255" y="45" font-size="14">content.js</text><line class="dg-life" x1="430" y1="62" x2="430" y2="590"/><rect class="dg-box" x="368" y="18" width="124" height="44" rx="10"/><text class="dg-t" x="430" y="45" font-size="14">ui.js</text><line class="dg-life" x1="610" y1="62" x2="610" y2="590"/><rect class="dg-box" x="548" y="18" width="124" height="44" rx="10"/><text class="dg-t" x="610" y="45" font-size="14">background.js</text><line class="dg-life" x1="785" y1="62" x2="785" y2="590"/><rect class="dg-box" x="723" y="18" width="124" height="44" rx="10"/><text class="dg-t" x="785" y="45" font-size="14">storage.local</text><line class="dg-life" x1="925" y1="62" x2="925" y2="590"/><rect class="dg-box dg-ext" x="863" y="18" width="124" height="44" rx="10"/><text class="dg-t" x="925" y="45" font-size="14">Frankfurter</text><rect class="dg-frame" x="560" y="345" width="420" height="122" rx="8"/><rect class="dg-frame-tag" x="560" y="345" width="168" height="22" rx="8"/><text class="dg-ft" x="570" y="360">if older than 1 hour</text><path class="dg-a" d="M84 105 H249" marker-end="url(#dgAr)"/><text class="dg-l" x="167.5" y="97" text-anchor="middle">Pointer rests on “22 990 Ft”</text><path class="dg-a" d="M259 140 H300 V164 H263" marker-end="url(#dgAr)"/><text class="dg-l" x="306" y="150" text-anchor="start">Hit-test the cached price rects</text><path class="dg-a" d="M259 205 H424" marker-end="url(#dgAr)"/><text class="dg-l" x="342.5" y="197" text-anchor="middle">Show the Convert to pill</text><path class="dg-a" d="M84 250 H424" marker-end="url(#dgAr)"/><text class="dg-l" x="255.0" y="242" text-anchor="middle">Pick EUR</text><path class="dg-a" d="M434 295 H604" marker-end="url(#dgAr)"/><text class="dg-l" x="520.0" y="287" text-anchor="middle">getRates(&quot;HUF&quot;)</text><text class="dg-note" x="520.0" y="311">skipped if asked in the last 5 minutes</text><path class="dg-a" d="M614 335 H779" marker-end="url(#dgAr)"/><text class="dg-l" x="697.5" y="327" text-anchor="middle">Read rates:EUR</text><path class="dg-a" d="M614 395 H919" marker-end="url(#dgAr)"/><text class="dg-l" x="767.5" y="387" text-anchor="middle">GET /v2/rates?base=EUR</text><path class="dg-a dg-dash" d="M921 425 H616" marker-end="url(#dgAr)"/><text class="dg-l" x="767.5" y="417" text-anchor="middle">Daily EUR table</text><path class="dg-a" d="M614 455 H779" marker-end="url(#dgAr)"/><text class="dg-l" x="697.5" y="447" text-anchor="middle">Save with a timestamp</text><path class="dg-a dg-dash" d="M606 510 H436" marker-end="url(#dgAr)"/><text class="dg-l" x="520.0" y="502" text-anchor="middle">HUF cross rates, date, source</text><path class="dg-a dg-dash" d="M426 560 H86" marker-end="url(#dgAr)"/><text class="dg-l" x="255.0" y="552" text-anchor="middle">Amount in EUR, rate, date and source</text></svg>