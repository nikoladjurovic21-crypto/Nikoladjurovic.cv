<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-24 -24 1128 298" width="1692" height="447"><style>.fl-card{fill:#fff;stroke:#e6e6ec;stroke-width:1.5}.fl-title{font:700 17px "Hanken Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#0e0e12}.fl-sub{font:500 13px "Hanken Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#4c4c58}.fl-note{font:600 12px "Hanken Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#5a38e6}</style><rect x="-24" y="-24" width="1128" height="298" fill="#ffffff"/>
  <title id="af-t">Simplified multi-tier approval flow</title>
  <desc id="af-d">A quote that needs sign-off goes to tier 1, then tier 2, then higher tiers as needed. Each tier approves or rejects. Every decision is written to an audit trail, and the approved quote goes back to the sales flow.</desc>
  <defs><marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#6d4aff"/></marker></defs>
  <g fill="none" stroke="#6d4aff" stroke-width="2">
    <path d="M182 90H222" marker-end="url(#ar2)"/><path d="M402 90H442" marker-end="url(#ar2)"/><path d="M622 90H662" marker-end="url(#ar2)"/><path d="M842 90H882" marker-end="url(#ar2)"/>
    <path d="M312 130V186" stroke-dasharray="5 5"/><path d="M532 130V186" stroke-dasharray="5 5"/><path d="M752 130V186" stroke-dasharray="5 5"/>
    <path d="M232 200H860" stroke-dasharray="5 5" marker-end="url(#ar2)"/>
  </g>
  <g text-anchor="middle">
    <g data-node><rect class="fl-card" x="20" y="50" width="162" height="80" rx="14"/><text x="101" y="78" class="fl-title">Quote</text><text x="101" y="116" class="fl-sub">needs sign-off</text></g>
    <g data-node data-emit="M312 130 V200 H866" data-emit-to="#af-audit"><rect class="fl-card" x="230" y="50" width="172" height="80" rx="14"/><text x="316" y="78" class="fl-title">Tier 1</text><text x="316" y="116" class="fl-sub">approve or reject</text></g>
    <g data-node data-emit="M532 130 V200 H866" data-emit-to="#af-audit"><rect class="fl-card" x="450" y="50" width="172" height="80" rx="14"/><text x="536" y="78" class="fl-title">Tier 2</text><text x="536" y="116" class="fl-sub">approve or reject</text></g>
    <g data-node data-emit="M752 130 V200 H866" data-emit-to="#af-audit"><rect class="fl-card" x="670" y="50" width="172" height="80" rx="14"/><text x="756" y="78" class="fl-title">Tier n</text><text x="756" y="116" class="fl-sub">as rules require</text></g>
    <g data-node><rect class="fl-card" x="890" y="50" width="170" height="80" rx="14"/><text x="975" y="78" class="fl-title">Approved</text><text x="975" y="116" class="fl-sub">back to the quote</text></g>
    <g id="af-audit"><rect class="fl-card" x="870" y="176" width="190" height="48" rx="12"/><text x="965" y="205" class="fl-note">Audit trail (SOX)</text></g>
  </g>
</svg>