<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-24 -24 1048 548" width="1572" height="822"><style>text{font-family:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.dg-zone{fill:#faf9ff;stroke:#ddd5fb;stroke-width:1.2;stroke-dasharray:5 5}.dg-z{font-size:11px;font-weight:700;letter-spacing:.09em;fill:#6d4aff}
.dg-box{fill:#fff;stroke:#cfc8ee;stroke-width:1.3}.dg-muted{fill:#f4f4f7;stroke:#d6d6df}.dg-ext{fill:#eefaf5;stroke:#9fdcc4}.dg-store{fill:#fffaf0;stroke:#ecd9a6}
.dg-t{font-weight:700;fill:#0e0e12;text-anchor:middle}.dg-s{font-size:12px;fill:#55546a;text-anchor:middle}
.dg-a{fill:none;stroke:#6d4aff;stroke-width:1.6}.dg-dash{stroke-dasharray:6 5;stroke:#8f7ae6}
.dg-l{font-size:11.5px;font-weight:600;fill:#3b2a8a;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round}
.dg-note{font-size:11px;font-style:italic;fill:#6b6a80;text-anchor:middle;paint-order:stroke;stroke:#fff;stroke-width:4px}
.dg-life{stroke:#cfc8ee;stroke-width:1.2;stroke-dasharray:4 5}.dg-frame{fill:rgb(109 74 255 / .04);stroke:#b9abf5;stroke-width:1.2}.dg-frame-tag{fill:#ece7ff}.dg-ft{font-size:11px;font-weight:700;fill:#5a38e6}</style><rect x="-24" y="-24" width="1048" height="548" fill="#ffffff"/><title id="dgArchT">Architecture: content scripts in every tab read the page text, find prices and draw an overlay; they ask the background script for rates; the background script keeps a one-hour rate table in local storage and fetches the euro table from Frankfurter, with ExchangeRate-API for missing currencies; the toolbar popup saves settings to sync storage, which every tab listens to, and can clear the rate cache.</title><defs><marker id="dgAr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6d4aff"/></marker><marker id="dgArS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6d4aff"/></marker></defs><rect class="dg-zone" x="20" y="30" width="170" height="340" rx="14"/><text class="dg-z" x="34" y="52">WEB PAGE</text><rect class="dg-zone" x="220" y="30" width="300" height="340" rx="14"/><text class="dg-z" x="234" y="52">CONTENT SCRIPTS, EVERY TAB</text><rect class="dg-zone" x="600" y="30" width="170" height="340" rx="14"/><text class="dg-z" x="614" y="52">BACKGROUND</text><rect class="dg-zone" x="820" y="30" width="160" height="340" rx="14"/><text class="dg-z" x="834" y="52">INTERNET</text><rect class="dg-box dg-muted" x="35" y="160" width="140" height="90" rx="10"/><text class="dg-t" x="105.0" y="193.0" font-size="14">Page text</text><text class="dg-s" x="105.0" y="211.0">read only,</text><text class="dg-s" x="105.0" y="227.0">never edited</text><rect class="dg-box" x="235" y="70" width="270" height="70" rx="10"/><text class="dg-t" x="370.0" y="101.5" font-size="14">detect.js</text><text class="dg-s" x="370.0" y="119.5">Finds prices in the visible text</text><rect class="dg-box" x="235" y="175" width="270" height="70" rx="10"/><text class="dg-t" x="370.0" y="206.5" font-size="14">content.js</text><text class="dg-s" x="370.0" y="224.5">Price registry and pointer hit-test</text><rect class="dg-box" x="235" y="280" width="270" height="70" rx="10"/><text class="dg-t" x="370.0" y="311.5" font-size="14">ui.js</text><text class="dg-s" x="370.0" y="329.5">Overlay above the page, closed Shadow DOM</text><rect class="dg-box" x="612" y="90" width="146" height="122" rx="10"/><text class="dg-t" x="685.0" y="130.5" font-size="14">background.js</text><text class="dg-s" x="685.0" y="148.5">Euro pivot</text><text class="dg-s" x="685.0" y="164.5">Cross rates</text><text class="dg-s" x="685.0" y="180.5">1-hour cache</text><rect class="dg-box" x="612" y="250" width="112" height="70" rx="10"/><text class="dg-t" x="668.0" y="281.5" font-size="13">storage.local</text><text class="dg-s" x="668.0" y="299.5">rate table</text><rect class="dg-box dg-ext" x="834" y="80" width="132" height="90" rx="10"/><text class="dg-t" x="900.0" y="113.0" font-size="14">Frankfurter</text><text class="dg-s" x="900.0" y="131.0">central-bank</text><text class="dg-s" x="900.0" y="147.0">reference rates</text><rect class="dg-box dg-ext" x="834" y="210" width="132" height="90" rx="10"/><text class="dg-t" x="900.0" y="243.0" font-size="13">ExchangeRate-API</text><text class="dg-s" x="900.0" y="261.0">fills missing</text><text class="dg-s" x="900.0" y="277.0">currencies</text><rect class="dg-box dg-store" x="235" y="410" width="270" height="70" rx="10"/><text class="dg-t" x="370.0" y="441.5" font-size="14">storage.sync</text><text class="dg-s" x="370.0" y="459.5">Settings, shared through Firefox Sync</text><rect class="dg-box" x="612" y="410" width="146" height="70" rx="10"/><text class="dg-t" x="685.0" y="441.5" font-size="14">Toolbar popup</text><text class="dg-s" x="685.0" y="459.5">popup.html</text><text class="dg-note" x="900" y="335">Same request</text><text class="dg-note" x="900" y="351">for every user</text><path class="dg-a" d="M175 190 H205 V105 H233" marker-end="url(#dgAr)"/><text class="dg-l" x="205" y="152" text-anchor="middle">reads</text><path class="dg-a" d="M370 140 V173" marker-end="url(#dgAr)"/><text class="dg-l" x="380" y="161" text-anchor="start">price Ranges</text><path class="dg-a" d="M370 245 V278" marker-end="url(#dgAr)"/><text class="dg-l" x="380" y="266" text-anchor="start">show pill or sheet</text><path class="dg-a" d="M505 315 H560 V151 H610" marker-start="url(#dgArS)" marker-end="url(#dgAr)"/><text class="dg-l" x="560" y="226" text-anchor="middle">getRates(base)</text><text class="dg-l" x="560" y="243" text-anchor="middle">rates, date, source</text><path class="dg-a" d="M668 212 V248" marker-start="url(#dgArS)" marker-end="url(#dgAr)"/><path class="dg-a" d="M758 125 H832" marker-end="url(#dgAr)"/><text class="dg-l" x="795" y="116" text-anchor="middle">EUR table</text><path class="dg-a dg-dash" d="M758 185 H795 V255 H832" marker-end="url(#dgAr)"/><text class="dg-l" x="795" y="228" text-anchor="middle">if gaps</text><path class="dg-a" d="M610 445 H507" marker-end="url(#dgAr)"/><text class="dg-l" x="558" y="437" text-anchor="middle">saves</text><path class="dg-a dg-dash" d="M235 445 H205 V215 H233" marker-end="url(#dgAr)"/><text class="dg-l" x="205" y="393" text-anchor="middle">onChanged</text><path class="dg-a" d="M742 408 V214" marker-end="url(#dgAr)"/><text class="dg-l" x="742" y="388" text-anchor="middle">clearCache</text></svg>