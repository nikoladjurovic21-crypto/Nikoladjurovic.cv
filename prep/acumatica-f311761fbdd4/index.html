<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Acumatica Final Round</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;600;700;800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: a study workbook. Scoreboard with a 4-hour plan strip on top, plan list on the left, one level as a long readable page. */
:root{
  --bg:#F5F6F8; --surface:#FFFFFF; --sunk:#EEF0F4; --ink:#1A2130; --muted:#5D6677; --hair:#E1E4EA; --hair2:#CDD2DB;
  --accent:#2D55E6; --accent-ink:#FFFFFF; --accent-soft:#E8EDFE; --xp:#D99511; --xp-soft:#FCF1DA;
  --good:#16895C; --good-soft:#E3F5EC; --bad:#C93C3C; --bad-soft:#FBE9E9; --warn:#A06300; --warn-soft:#FDF3DF;
  --head:#141A26; --head-ink:#F2F4F8; --head-muted:#9AA3B3; --head-track:#283043;
  --f-ui:"Schibsted Grotesk","Segoe UI",system-ui,sans-serif;
  --f-read:"Source Serif 4",Georgia,"Times New Roman",serif;
  --f-code:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1218; --surface:#161B24; --sunk:#1B212C; --ink:#E7EAF0; --muted:#9AA3B3; --hair:#252C38; --hair2:#333B4A;
  --accent:#7D9BFF; --accent-ink:#0E1218; --accent-soft:#1D2742; --xp:#F0B44A; --xp-soft:#33280F;
  --good:#45C58C; --good-soft:#12291F; --bad:#F07A7A; --bad-soft:#2E1719; --warn:#F0B44A; --warn-soft:#2D2412;
  --head:#0A0D13; --head-ink:#E7EAF0; --head-muted:#8A93A3; --head-track:#222937; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0E1218; --surface:#161B24; --sunk:#1B212C; --ink:#E7EAF0; --muted:#9AA3B3; --hair:#252C38; --hair2:#333B4A;
  --accent:#7D9BFF; --accent-ink:#0E1218; --accent-soft:#1D2742; --xp:#F0B44A; --xp-soft:#33280F;
  --good:#45C58C; --good-soft:#12291F; --bad:#F07A7A; --bad-soft:#2E1719; --warn:#F0B44A; --warn-soft:#2D2412;
  --head:#0A0D13; --head-ink:#E7EAF0; --head-muted:#8A93A3; --head-track:#222937; color-scheme:dark;}
*{box-sizing:border-box} body{margin:0} [hidden]{display:none!important} img{max-width:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--head)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent);text-underline-offset:2px}

/* Scoreboard */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--head);color:var(--head-ink);
  padding-block:12px 10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar-in{max-width:1200px;margin:0 auto;display:flex;flex-wrap:wrap;gap:10px 24px;align-items:center}
.brand{font-weight:700;font-size:16px;letter-spacing:-.01em;white-space:nowrap}
.brand span{color:var(--head-muted);font-weight:500}
.rank{display:flex;align-items:center;gap:12px;flex:1 1 260px;min-width:0}
.rank-name{font-weight:700;font-size:14px;color:var(--xp);white-space:nowrap}
.xpwrap{flex:1;min-width:90px}
.xptrack{height:6px;background:var(--head-track);border-radius:99px;overflow:hidden}
.xpfill{height:100%;width:0;background:var(--xp);border-radius:99px;transition:width .5s ease}
.xpnum{font-size:12px;color:var(--head-muted);font-variant-numeric:tabular-nums;margin-top:3px}
.clock{display:flex;align-items:center;gap:10px;font-variant-numeric:tabular-nums}
.clock .t{font-size:20px;font-weight:700;letter-spacing:-.01em}
.pace{font-size:12px;padding:2px 9px;border-radius:99px;font-weight:600}
.pace.ok{background:rgba(69,197,140,.16);color:#5FD39E} .pace.behind{background:rgba(240,180,74,.16);color:#F3BE5E} .pace.idle{background:var(--head-track);color:var(--head-muted)}
.hbtn{border:1px solid var(--head-track);background:transparent;color:var(--head-ink);padding:6px 12px;border-radius:8px;font-size:13px;font-weight:600}
.hbtn:hover{border-color:var(--head-muted)}
.hbtn.go{background:#F2F4F8;color:#141A26;border-color:#F2F4F8}
/* The one memorable element: the 4-hour plan strip */
.plan{max-width:1200px;margin:10px auto 0;position:relative}
.segs{display:flex;gap:3px;height:10px}
.seg{border-radius:3px;background:var(--head-track);position:relative;border:0;padding:0;min-width:6px}
.seg.done{background:#7D9BFF}
.seg.cur{background:var(--head-track);box-shadow:inset 0 0 0 1.5px #7D9BFF}
.seg:hover{filter:brightness(1.3)}
.now{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--xp);border-radius:2px;left:0;transition:left 1s linear;pointer-events:none}
.now::after{content:"";position:absolute;top:-3px;left:-3px;width:8px;height:8px;border-radius:50%;background:var(--xp)}
.planlabels{padding-left:8px;display:flex;justify-content:space-between;font-size:11.5px;color:var(--head-muted);margin-top:4px;font-variant-numeric:tabular-nums}

/* Shell */
.shell{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:250px minmax(0,1fr);gap:48px;
  padding-block:32px 72px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.map{position:sticky;top:calc(env(safe-area-inset-top,0px) + 112px);align-self:start;display:flex;flex-direction:column;gap:2px;max-height:calc(100vh - 130px);overflow-y:auto}
.map h2{font-size:13px;color:var(--muted);margin:0 0 8px 10px;font-weight:600}
.lvl{display:grid;grid-template-columns:24px 1fr auto;gap:10px;align-items:center;text-align:left;border:0;background:none;padding:7px 10px;border-radius:8px}
.lvl:hover{background:var(--sunk)}
.lvl.cur{background:var(--accent-soft)}
.lvl.cur .nm{color:var(--ink);font-weight:700}
.lvl .n{font-size:11.5px;font-weight:700;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--hair2);color:var(--muted);font-variant-numeric:tabular-nums}
.lvl.done .n{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.lvl .nm{font-size:14px;font-weight:500;line-height:1.3;color:var(--muted)}
.lvl.done .nm{color:var(--ink)}
.lvl .mn{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.badges{margin-top:20px;padding:14px 10px 0;border-top:1px solid var(--hair)}
.badges h3{margin:0 0 10px;font-size:13px;color:var(--muted);font-weight:600}
.bdg{display:inline-block;font-size:12px;padding:3px 9px;border-radius:99px;margin:0 4px 6px 0;color:var(--muted);border:1px dashed var(--hair2)}
.bdg.on{background:var(--xp-soft);color:var(--xp);border:1px solid transparent;font-weight:600}
.reset{margin-top:10px}
.linkbtn{border:0;background:none;padding:0;font-size:12.5px;color:var(--muted);text-decoration:underline;text-underline-offset:2px}
main{min-width:0}

/* Level header */
.lvhead{padding-bottom:22px;margin-bottom:30px;border-bottom:1px solid var(--hair)}
.lvhead .kicker{font-size:14px;color:var(--accent);font-weight:600;margin-bottom:6px}
h1{font-weight:800;font-size:clamp(30px,4.6vw,48px);line-height:1.04;letter-spacing:-.03em;margin:0 0 10px;text-wrap:balance}
.meta{font-size:14px;color:var(--muted)}
.meta b{color:var(--ink);font-weight:600}

/* Reading */
.lesson{max-width:68ch;font-family:var(--f-read);font-size:17.5px;line-height:1.72}
.lesson h3{font-family:var(--f-ui);font-weight:700;font-size:21px;line-height:1.25;margin:38px 0 10px;letter-spacing:-.015em;text-wrap:balance}
.lesson p{margin:0 0 14px}
.lesson ul,.lesson ol{margin:0 0 16px;padding-left:22px}
.lesson li{margin-bottom:6px}
.lesson li::marker{color:var(--muted)}
.lesson b{font-weight:600}
.lesson code,.mono{font-family:var(--f-code);font-size:.8em;background:var(--sunk);padding:1px 6px;border-radius:5px}
.note,.flag{font-size:16px;padding:14px 18px;border-radius:10px;margin:20px 0;line-height:1.6}
.note{background:var(--accent-soft)}
.flag{background:var(--warn-soft)}
.note b:first-child{color:var(--accent)} .flag b:first-child{color:var(--warn)}
.tw{overflow-x:auto;margin:14px 0 22px;border:1px solid var(--hair);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-family:var(--f-ui);font-size:14.5px;line-height:1.45;min-width:520px}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--hair);vertical-align:top}
th{font-size:13px;color:var(--muted);font-weight:600;background:var(--sunk)}
tr:last-child td{border-bottom:0}
td:first-child{font-weight:600}
pre{font-family:var(--f-code);font-size:13px;background:var(--sunk);border-radius:10px;padding:14px 16px;overflow-x:auto;line-height:1.55;border:1px solid var(--hair)}

/* Activities */
.act{margin-top:52px;padding-top:30px;border-top:1px solid var(--hair)}
.act > h2{font-size:24px;font-weight:800;letter-spacing:-.02em;margin:0 0 6px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.act > p.sub{color:var(--muted);margin:0 0 18px;font-size:14.5px}
.tag{font-size:12.5px;padding:2px 10px;border-radius:99px;background:var(--xp-soft);color:var(--xp);font-weight:600;letter-spacing:0}
.qs{display:grid;gap:14px}
.q{background:var(--surface);border:1px solid var(--hair);border-radius:12px;padding:18px 20px}
.q .qt{font-weight:600;font-size:16px;margin-bottom:12px;line-height:1.4}
.q .qn{color:var(--muted);font-weight:500;margin-right:6px;font-variant-numeric:tabular-nums}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:1px solid var(--hair2);background:var(--surface);padding:10px 14px;border-radius:9px;font-size:15px;line-height:1.4;display:flex;gap:10px;align-items:flex-start}
.opt::before{content:"";flex:none;width:16px;height:16px;margin-top:2px;border-radius:50%;border:1.5px solid var(--hair2)}
.opt:hover:not([disabled]){border-color:var(--accent);background:var(--accent-soft)}
.opt.right{background:var(--good-soft);border-color:var(--good)}
.opt.right::before{background:var(--good);border-color:var(--good);box-shadow:inset 0 0 0 3px var(--good-soft)}
.opt.wrong{background:var(--bad-soft);border-color:transparent;color:var(--muted)}
.opt.wrong::before{border-color:var(--bad)}
.opt[disabled]{cursor:default}
.why{margin-top:12px;font-size:14.5px;color:var(--muted);line-height:1.55}
.why b{color:var(--good)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.fc{background:var(--surface);border:1px solid var(--hair);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;min-height:150px}
.fc .front{font-weight:700;font-size:16.5px;line-height:1.3;letter-spacing:-.01em}
.fc .back{font-family:var(--f-read);font-size:15.5px;line-height:1.55;color:var(--ink)}
.fc .row{margin-top:auto;display:flex;gap:8px;flex-wrap:wrap}
.fc.known{border-color:var(--good);background:linear-gradient(var(--good-soft),var(--good-soft)) top/100% 4px no-repeat,var(--surface)}
.btn{border:1px solid var(--hair2);background:var(--surface);color:var(--ink);padding:7px 14px;border-radius:8px;font-size:14px;font-weight:600}
.btn:hover:not([disabled]){border-color:var(--accent);color:var(--accent)}
.btn[disabled]{opacity:.55;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover:not([disabled]){filter:brightness(1.08);color:var(--accent-ink)}
.btn.xp{background:var(--xp-soft);border-color:transparent;color:var(--xp)}
.boss{background:var(--surface);border:1px solid var(--hair);border-radius:12px;padding:20px 22px;margin-bottom:14px}
.boss .bq{font-weight:700;font-size:18px;line-height:1.35;letter-spacing:-.01em;text-wrap:balance}
.boss .bq .qn{color:var(--muted);font-weight:500;margin-right:6px}
.boss .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px}
.boss .tm{font-variant-numeric:tabular-nums;font-size:15px;font-weight:700;min-width:48px;color:var(--accent)}
.boss .reveal{margin-top:16px;padding-top:14px;border-top:1px solid var(--hair);font-family:var(--f-read);font-size:16px;line-height:1.65}
.boss .reveal h4{font-family:var(--f-ui);margin:4px 0 6px;font-size:13.5px;color:var(--muted);font-weight:600}
.boss .reveal ul,.boss .reveal ol{margin:0 0 8px;padding-left:22px}
.boss .reveal .row{font-family:var(--f-ui)}
.grade{font-size:12.5px;padding:2px 10px;border-radius:99px;font-weight:600}
.grade.g2{background:var(--good-soft);color:var(--good)} .grade.g1{background:var(--warn-soft);color:var(--warn)} .grade.g0{background:var(--bad-soft);color:var(--bad)}
.checks{display:grid;gap:8px}
.ck{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--hair);border-radius:10px;padding:12px 14px;font-size:15px}
.ck input{margin-top:2px;width:18px;height:18px;accent-color:var(--accent);flex:none}
.ck label{cursor:pointer}
.ck:has(input:checked) label{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--hair2)}
.story{background:var(--surface);border:1px solid var(--hair);border-radius:12px;padding:18px 20px;margin:16px 0;font-size:16px}
.story h4{margin:0 0 4px;font-family:var(--f-ui);font-size:18px;font-weight:700;letter-spacing:-.01em}
.story .use{font-family:var(--f-ui);font-size:13.5px;color:var(--accent);font-weight:600;margin-bottom:8px}
.story ul{margin:6px 0 0;padding-left:20px}
.story .flag{margin:12px 0 0}
.foot{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-top:52px;padding-top:22px;border-top:1px solid var(--hair)}
.toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);
  padding:9px 15px;border-radius:10px;font-weight:600;font-size:14px;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none;z-index:20}
.toast.show{opacity:1;transform:none}
.toast b{color:var(--xp)}
.src{font-family:var(--f-ui);font-size:14.5px} .src li{margin-bottom:4px}
@media (max-width:900px){
  .bar{position:static}
  .shell{grid-template-columns:minmax(0,1fr);gap:20px;padding-block:20px 60px}
  .map{position:static;flex-direction:row;overflow-x:auto;max-height:none;gap:4px;padding-bottom:4px}
  .map h2,.badges{display:none}
  .lvl{grid-template-columns:auto auto;flex:none}
  .lvl .mn{display:none}
  .lvl .nm{font-size:13.5px;white-space:nowrap}
  .lesson{font-size:16.5px}
}
@media (max-width:560px){ .planlabels span:nth-child(2){display:none} .brand span{display:none} }
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>



</head>
<body>
<header class="bar">
  <div class="bar-in">
    <div class="brand">Acumatica final round <span>Senior BSA, Platform ML</span></div>
    <div class="rank">
      <span class="rank-name" id="rankName">Trainee</span>
      <div class="xpwrap"><div class="xptrack"><div class="xpfill" id="xpFill"></div></div>
      <div class="xpnum" id="xpNum">0 XP</div></div>
    </div>
    <div class="clock">
      <span class="t" id="clock">4:00:00</span>
      <span class="pace idle" id="pace">not started</span>
      <button class="hbtn go" id="clockBtn">Start clock</button>
      <button class="hbtn" id="themeBtn" aria-label="Color theme">Auto</button>
    </div>
  </div>
  <div class="plan" aria-label="Four-hour plan by level">
    <div class="segs" id="segs"></div>
    <div class="now" id="now"></div>
    <div class="planlabels"><span>0:00</span><span id="planMid">Plan: 12 levels in 4 hours</span><span>4:00</span></div>
  </div>
</header>

<div class="shell">
  <nav class="map" id="map" aria-label="Levels"></nav>
  <main id="main"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ---------- CONTENT ---------- */
const M = [];

M.push({id:"m0",title:"Mission briefing",min:5,badge:"Briefed",
lesson:`
<p>You are interviewing for <b>Senior Business System Analyst, Platform Machine Learning team, Belgrade</b>. The team builds the chat interface that puts AI into everyday Acumatica work. The job ad puts weight on two things: <b>complex API integrations</b> and <b>UI design for B2B/ERP systems</b>.</p>
<h3>What a final round can contain</h3>
<p>You do not know the exact format, so this course prepares for all of the usual parts:</p>
<ul>
<li>Experience questions, answered with your own artifacts (Level 7).</li>
<li>A live case: spec a feature on the spot (Level 10, question 1).</li>
<li>A defense of the Order Risk Hold SDD you wrote for their qualification task (Level 8).</li>
<li>Technical understanding: ERP platform, APIs, LLM tool calling (Levels 3 to 5).</li>
<li>Gaps against the ad: 10+ years, developer background, C#, technical degree (Level 9).</li>
<li>Motivation, salary, notice period, your questions for them (Levels 9 and 11).</li>
</ul>
<h3>How the game works</h3>
<p>The clock runs 4 hours. Each level has a target time in the map. The pace pill turns amber if you fall behind the plan. Quiz answers right on the first try give 10 XP, flashcards you know give 5, boss answers you nail give 30, completing a level gives 50. Progress stays in this browser.</p>
<div class="note"><b>Rule for the whole course.</b> Facts about Acumatica come from public sources listed in Level 11. Facts about you come from your master profile and your own HLEs. Anything marked <b>[confirm]</b> needs your check before you say it aloud.</div>`,
checks:[
 "Open the interview invite. Write down who is on the call, their roles, and the length.",
 "If the format is unclear, send the recruiter one line: 'Will the session include a case or exercise, and who will join?'",
 "Open your Order Risk Hold SDD and your AI Voice Control HLE in another window.",
 "Block 4 hours, phone on silent, water on the desk."
]});

M.push({id:"m1",title:"Know the company",min:15,badge:"Insider",
lesson:`
<h3>The business</h3>
<ul>
<li>Cloud ERP for small and midsize companies. Headquarters in Bellevue, Washington.</li>
<li>Engineering sits in the US, Canada, Serbia and Sri Lanka. A Hyderabad capability center opened in August 2026. The Belgrade office is on Kneza Miloša.</li>
<li>Sold mainly through partners: VARs who implement it and ISVs who build add-ons on the platform. Customers buy AI Assistant through their VAR or customer success manager.</li>
<li>Pricing is based on resources used rather than per named user. That is what the ad calls "growth-friendly licensing", and it is a classic sales argument against per-seat competitors.</li>
<li>Editions by industry: General Business (finance, CRM, payments), Distribution, Manufacturing, Construction, Professional Services, Field Service, Retail Commerce, plus Payroll.</li>
</ul>
<h3>Ownership and leadership</h3>
<ul>
<li>Vista Equity Partners signed to buy Acumatica on 29 May 2025, from EQT, which had owned it since 2019. The deal closed in late July 2025.</li>
<li>CEO: John Case (CEO since 2022). He framed the Vista deal as money to speed up, not change, an AI-first roadmap.</li>
<li>Chief Product Officer: Jon Pollock. His line on 2026 R2 was that growing businesses want practical AI rather than more experiments.</li>
<li>Omar Ghazi, Director of Product Management for Platform, AI and Technology, writes the public AI Assistant FAQ. Worth knowing the name; do not assume he is on your call.</li>
<li>Vista runs an internal "Agentic Factory" team that helps portfolio companies decide what AI to build. Acumatica says it works with it.</li>
</ul>
<h3>Release rhythm</h3>
<div class="tw"><table>
<tr><th>Release</th><th>GA</th><th>What matters for you</th></tr>
<tr><td>2025 R2</td><td>autumn 2025</td><td>AI Automation (then called AI Studio) appears as an experimental feature</td></tr>
<tr><td>2026 R1</td><td>March 2026</td><td>AI Studio GA, AI Assistant in early access (managed availability)</td></tr>
<tr><td>2026 R2</td><td>1 Oct 2026</td><td>AI Assistant GA, AI agents, MCP servers, data warehouse tables, Modern UI is the default</td></tr>
<tr><td>2027 R1</td><td>planned</td><td>Classic-only forms retired</td></tr>
</table></div>
<p>Two major releases a year, R1 in spring and R2 in autumn. The ad's phrase "products with a continuous life cycle" means exactly this: you spec into a release train that never stops, the same as SPQ+.</p>
<h3>Competitors you should be able to name</h3>
<p>Oracle NetSuite, Microsoft Dynamics 365 Business Central (with Copilot), Sage Intacct (Sage Copilot), SAP Business One, Epicor, Infor. Every one of them now ships some AI assistant. The ad asks you to analyze competitor solutions, so expect "how would you compare us with X". Level 10 has the method. Do not quote competitor features you have not checked.</p>
<h3>Culture words from the ad</h3>
<p>Work/life balance, efficiency, simplicity, "freakishly friendly customer service", making a difference. Use one of them naturally, never all of them.</p>`,

M.push({id:"m2",title:"Acumatica AI, as shipped",min:25,badge:"AI Cartographer",
lesson:`
<p>This is the product area you would join. Know it better than the other candidates.</p>
<h3>The three-phase AI plan (stated at the 2026 R2 launch)</h3>
<div class="tw"><table>
<tr><th>Phase</th><th>When</th><th>Meaning</th></tr>
<tr><td>1. Assistance</td><td>now</td><td>Ask questions in plain language, extract data from documents, get help in context</td></tr>
<tr><td>2. Agentic automation</td><td>2026 to 2027</td><td>Agents run multi-step routines, a person approves the result</td></tr>
<tr><td>3. Strategic autonomy</td><td>2027 onward</td><td>Planning and forecasting that adjust themselves</td></tr>
</table></div>
<p>2026 R2 is mostly phase 1, with AI Studio adding the first phase 2 building blocks.</p>
<h3>AI Assistant (the chat interface)</h3>
<ul>
<li>A natural-language chat window reachable from anywhere in the app. Answers come back as text, tables, column charts or pivot tables.</li>
<li><b>Data comes only from Generic Inquiries (GIs)</b> that an administrator exposes to it.</li>
<li><b>Security is inherited</b> from each GI's access rights, so users only see what they could already see. No extra security setup.</li>
<li>Persistent chat threads, so follow-ups build on earlier questions.</li>
<li>One click turns an answer into a dashboard widget. In 2026 R2 you can drag it onto a dashboard as a live tile and see the source inquiry behind it.</li>
<li>Only administrators have it by default. Others need the <code>AI Assistant User</code> role.</li>
<li>Requires 2026 R1 or later. GA for all customers since the 2026 R2 release.</li>
<li><b>Limits today:</b> it cannot perform actions or update records, and cannot reach data outside the exposed inquiries.</li>
<li>2026 R2 added: a "self-aware" skill (it says what it can and cannot do), a "context-aware" skill (it knows the screen or record you are on), a Help Agent that answers how-to questions from the documentation portal (Beacon) for your exact version, and widget management. Partners also report it can draft a GI from a description.</li>
<li>Edition examples: which warehouse can ship 500 units by Friday, in-stock alternatives, historical AR/AP ageing at a past date, shop-floor slowdowns, payment settlement matching.</li>
</ul>
<h3>Cost and privacy</h3>
<ul>
<li><b>AI Units</b> are the consumption currency. They blend input, output and cache tokens across the several models the assistant uses. Monthly allocation; when it runs out the assistant stops until reset or a top-up. Usage screen: <code>ML900000</code> AI Unit Consumption, plus the License Monitoring Console.</li>
<li>Prompts and a record that a tool call succeeded are stored briefly so follow-ups work, then purged. The underlying data is not stored. Customer data does not train models; it uses existing foundation models.</li>
</ul>
<h3>AI Studio</h3>
<ul>
<li>Contains <b>AI Automation</b> and <b>Anomaly Detection</b>. Low-code: an admin writes a standard procedure in plain language and sets triggers.</li>
<li>2026 R1 added sensitive-field <b>masking</b> (masked before the record goes to the LLM, restored inside Acumatica) and statistics.</li>
<li>2026 R2 <b>agents</b>: created with plain-language instructions, started by a <b>Business Event</b>, an <b>Import/Export Scenario</b> or an existing <b>workflow</b>. They read context from GIs, act on eligible records, and can hand off to another agent or automated step. Examples given: adjust prices to target margin, qualify leads, assess credit risk. They run under existing access rights. Logs show token counts per run, with warnings near AI Unit limits.</li>
</ul>
<h3>MCP servers (new in 2026 R2)</h3>
<ul>
<li>An admin enables the feature, creates a server in AI Studio, and adds published GIs. <b>Each GI becomes a tool</b> that Claude, ChatGPT or Gemini can call, with filter, sort, paging and field selection.</li>
<li>Sign-in through OAuth 2.0. Every request runs as the signed-in user, rights are checked on every call, every call is logged in Access History.</li>
<li>Read-only in this release. Acumatica recommends 50 tools or fewer per server so the model picks the right one.</li>
</ul>
<h3>Analytics underneath</h3>
<p>An admin can store a GI's results in a data warehouse table, refreshed on a schedule or by hand. The stored copy feeds dashboards, OData, pivots and MCP. Caveat partners call out: field-level access restrictions are not applied to the stored data. Reporting now runs on a separate optimized copy so it does not compete with order entry.</p>
<div class="note"><b>The pattern to say out loud.</b> In 2026 R2 the Generic Inquiry layer is the AI boundary. The assistant, the agents and MCP all read through GIs, and all of them run as the user. Whoever designs which GIs exist, how they are named and who can see them is designing what the AI knows.</div>
<div class="flag"><b>Where the work probably goes next (your hypothesis, say it as one).</b> The assistant reads but cannot act. Phase 2 is actions with a person approving. A chat that creates or changes records needs clarification rules, confirmation gates, permission checks, idempotent API calls and clear failure messages. You specified exactly that pattern for SPQ+ voice control. Ask them whether actions from chat are on their roadmap rather than claiming you know.</div>`,
quiz:[
 {q:"Where does AI Assistant get its answers?",o:["Directly from the SQL database","From Generic Inquiries an admin exposes to it","From the public internet","From uploaded documents only"],a:1},
 {q:"Can AI Assistant update a sales order today?",o:["Yes, any field","Yes, with confirmation","No, it cannot perform actions or update records","Only admins can"],a:2},
 {q:"How does AI Assistant enforce security?",o:["A separate AI permission matrix","It inherits each GI's access rights","It masks all data","It has no security, admin-only"],a:1},
 {q:"What is an AI Unit?",o:["A licensed seat","A blend of input, output and cache tokens across models","One chat message","One GI call"],a:1},
 {q:"Who can use AI Assistant right after it is enabled?",o:["Everyone","Administrators only, others need the AI Assistant User role","Partners only","Nobody until training"],a:1},
 {q:"In a 2026 R2 MCP server, what becomes a tool?",o:["Each screen","Each published Generic Inquiry","Each REST endpoint","Each user role"],a:1},
 {q:"What can start an AI Studio agent in 2026 R2?",o:["A Business Event, an Import/Export Scenario or a workflow","Only a chat message","A cron job outside Acumatica","An email to support"],a:0},
 {q:"What does field masking do?",o:["Hides fields on screen","Masks selected fields before the record is sent to the LLM and restores them inside Acumatica","Encrypts the database","Deletes sensitive data"],a:1},
 {q:"Phase 2 of the AI plan is:",o:["Assistance","Agentic automation with human approval","Strategic autonomy","Model training"],a:1},

],

M.push({id:"m3",title:"ERP and platform basics",min:25,badge:"Framework Fluent",
lesson:`
<h3>ERP processes in one table</h3>
<div class="tw"><table>
<tr><th>Process</th><th>Document flow</th></tr>
<tr><td>Order to cash (O2C)</td><td>Quote / opportunity → sales order → shipment → AR invoice → customer payment</td></tr>
<tr><td>Procure to pay (P2P)</td><td>Requisition → purchase order → purchase receipt → AP bill → vendor payment</td></tr>
<tr><td>Record to report (R2R)</td><td>Transactions post to the general ledger → period close → financial statements</td></tr>
<tr><td>Plan to produce</td><td>Demand → MRP → production order → material issue, labor, output → finished goods</td></tr>
</table></div>
<p>Every document has a status, and statuses gate actions. You already used this in the SDD: a held sales order cannot create a shipment.</p>
<h3>How Acumatica is built</h3>
<ul>
<li><b>Acumatica Framework (also called xRP).</b> The application platform, written in C# on .NET. Partners and Acumatica both build on it.</li>
<li><b>DAC (data access class).</b> A C# class describing one table: its fields, types, defaults, and attributes such as which field is a selector or required.</li>
<li><b>Graph</b> (business logic controller). The server-side logic behind a screen: data views, events (field changed, row persisting) and actions (Release, Hold, Create Shipment).</li>
<li><b>Screen IDs.</b> Two letters for the module plus six digits. <code>SO301000</code> is Sales Orders. Learn to read them: SO sales orders, PO purchasing, AR receivables, AP payables, IN inventory, GL ledger, CR CRM, SM system.</li>
<li><b>Generic Inquiry (GI).</b> A query built in the UI (screen <code>SM208000</code>): tables, joins, conditions, fields, parameters. Feeds dashboards, OData, AI Assistant and MCP tools.</li>
<li><b>Business Events.</b> Fire when data matches a condition or on a schedule. They can send notifications, run an import scenario and, since 2026 R2, start an agent.</li>
<li><b>Import/Export Scenarios.</b> Mapped data loads in and out, configured in the UI.</li>
<li><b>Workflow engine.</b> States, transitions and actions for a document type, adjustable without code.</li>
<li><b>Customization Projects.</b> A package of code, screen changes and DB changes published to a tenant. This is how partners ship add-ons.</li>
<li><b>Push notifications</b> send changes from a GI or query to an external URL. <b>Webhooks</b> receive inbound calls and run a handler.</li>
<li><b>Access rights</b> by role, down to screen, action and field level. <b>Tenants</b> separate companies in one instance.</li>
<li><b>Modern UI.</b> The new front end, the default since 2026 R2. AI Studio, anomaly detection and the assistant are Modern UI features.</li>
</ul>
<div class="note"><b>Why a BSA cares.</b> When you write "the assistant creates a sales order", a developer hears: which graph, which action, which DAC fields, which statuses, which rights. Your spec should name the document, the status rules and the actions, even if you never write the C#.</div>`,

 {q:"What is a DAC?",o:["A dashboard","A C# class that defines a table and its fields","A REST endpoint","A user role"],a:1},

 {q:"Which object feeds dashboards, OData, AI Assistant and MCP tools?",o:["Generic Inquiry","Customization project","Workflow","Tenant"],a:0},
 {q:"Order to cash, in order:",o:["Invoice → order → shipment → payment","Sales order → shipment → invoice → payment","Payment → invoice → order","PO → receipt → bill"],a:1},

],

M.push({id:"m4",title:"APIs and integrations",min:35,badge:"Integration Architect",
lesson:`
<h3>HTTP in five minutes</h3>
<div class="tw"><table>
<tr><th>Verb</th><th>Use</th></tr>
<tr><td>GET</td><td>Read. Safe, no side effects.</td></tr>
<tr><td>POST</td><td>Create or trigger an action. Not idempotent by default.</td></tr>
<tr><td>PUT</td><td>Create or replace. Idempotent: the same call twice leaves the same state. Acumatica uses PUT for create-or-update.</td></tr>
<tr><td>PATCH</td><td>Partial update</td></tr>
<tr><td>DELETE</td><td>Remove</td></tr>
</table></div>
<p>Status codes you should explain without thinking: <code>200</code> OK, <code>201</code> created, <code>204</code> no content, <code>400</code> bad request, <code>401</code> not authenticated, <code>403</code> authenticated but not allowed, <code>404</code> not found, <code>409</code> conflict with current state (your SDD returns it when shipment is blocked), <code>422</code> validation failed, <code>429</code> too many requests, <code>500</code> server error, <code>503</code> unavailable.</p>
<h3>Authentication</h3>
<ul>
<li><b>OAuth 2.0 authorization code (with PKCE)</b>: a user signs in and the app acts as that user. This is what a chat assistant or MCP client needs, because the AI must see only what the user may see.</li>
<li><b>Client credentials</b>: machine to machine, no user. Fine for a nightly sync, wrong for a user-facing assistant.</li>
<li>Access token (short-lived) plus refresh token (needs the <code>offline_access</code> scope). In Acumatica you register the client on the Connected Applications screen.</li>
<li>Older integrations use cookie-based login. Recommend OAuth for anything new.</li>
</ul>
<h3>Acumatica's integration surfaces</h3>
<div class="tw"><table>
<tr><th>Surface</th><th>What it is</th><th>When</th></tr>
<tr><td>Contract-based REST API</td><td>Versioned endpoints exposing business entities (Customer, SalesOrder, StockItem, 200+ objects) as JSON. Extend an endpoint to add fields. Actions such as releasing a document are called on the entity.</td><td>Default for all new integrations</td></tr>
<tr><td>Contract-based SOAP</td><td>Same contracts over SOAP</td><td>Legacy clients</td></tr>
<tr><td>Screen-based SOAP</td><td>Drives screens as if a user clicked</td><td>Legacy; breaks when screens change</td></tr>
<tr><td>OData (GI-based)</td><td>Read a published Generic Inquiry</td><td>Reporting, BI, Power BI</td></tr>
<tr><td>OData (DAC-based)</td><td>Read tables directly at <code>/api/odata/dac</code></td><td>Analytics needing raw data</td></tr>
<tr><td>Push notifications / webhooks</td><td>Outbound change events / inbound handlers</td><td>Event-driven sync</td></tr>
<tr><td>Import/Export Scenarios</td><td>UI-configured batch mapping</td><td>Bulk loads</td></tr>
<tr><td>MCP server (26R2)</td><td>Published GIs as AI tools</td><td>External AI clients, read-only</td></tr>
</table></div>
<p>Details developers will expect you to know:</p>
<ul>
<li>Every field in REST JSON is wrapped, for example <code>"CustomerID": {"value": "C000123"}</code>.</li>
<li>Query options: <code>$filter</code>, <code>$select</code>, <code>$expand</code> (child records like order lines), <code>$top</code>, <code>$skip</code>.</li>
<li>Some business logic only fires in the order a user would trigger it (get, update, then call the action). Integrators get caught by this.</li>
<li>License tiers cap concurrent API users and request rates. Bursty integrations hit login-limit and throttling errors. 2026 R2 added an <b>API Monitoring</b> tab in System Monitor showing volume, errors, throttling and license use.</li>
</ul>
<pre>GET /entity/Default/&lt;version&gt;/SalesOrder?$filter=Status eq 'Open'
    &amp;$select=OrderNbr,CustomerID,OrderTotal&amp;$expand=Details&amp;$top=50
Authorization: Bearer &lt;access token for the signed-in user&gt;</pre>
<h3>Integration design checklist (use it in any case question)</h3>
<ol>
<li><b>Source of truth.</b> Which system owns each field?</li>
<li><b>Direction and trigger.</b> One-way or two-way. Event (push, webhook, business event) or polling with a <code>LastModified</code> filter.</li>
<li><b>Sync or async.</b> Does the user wait? If not, queue it.</li>
<li><b>Idempotency.</b> A retried "create order" must not create two orders. Use an external reference or idempotency key.</li>
<li><b>Retries and limits.</b> Back off on <code>429</code> and <code>503</code>. Throttle to the license limit.</li>
<li><b>Mapping.</b> Field to field, units, currencies, code lists, defaults.</li>
<li><b>Partial failure.</b> Header saved, line rejected: what does the user see, what rolls back?</li>
<li><b>Errors visible to people.</b> Per-record error, not a silent log.</li>
<li><b>Security.</b> Which identity, which scopes, which fields masked.</li>
<li><b>Audit and monitoring.</b> Who did what, through which channel.</li>
</ol>
<div class="note"><b>Your bridge.</b> Lead Time Alignment (DMND0032797): SPQ+ calls the shared SAP/SFM lead-time API as single source of truth, every line-creation path covered, async throttled queue instead of a synchronous call, throttling added even after being told there was no rate limit, dummy items without SAP records flagged as a known limitation in the HLE. That story hits items 1, 2, 3, 5 and 8 of the checklist.</div>`,
quiz:[
 {q:"Which Acumatica API should a new integration use?",o:["Screen-based SOAP","Contract-based REST","Direct SQL","Excel export"],a:1},
 {q:"Why prefer contract-based over screen-based APIs?",o:["Faster to type","A screen layout change does not break the integration","Free of license limits","Supports XML only"],a:1},
 {q:"A BI team wants read-only reporting data. Best surface?",o:["OData from a GI","Screen-based SOAP","Push notifications","Customization project"],a:0},
 {q:"Shipment is blocked by a risk hold. Best status code?",o:["200","404","409","500"],a:2},
 {q:"The API answers 429. What should the client do?",o:["Retry immediately in a loop","Back off and retry later, throttle","Give up and delete the record","Switch to SOAP"],a:1},
 {q:"Network drops after 'create order' is sent. How do you avoid a duplicate on retry?",o:["Hope","Idempotency key or external reference checked before create","Use GET","Turn off retries forever"],a:1},
 {q:"A chat assistant must see only what the user may see. Which OAuth flow?",o:["Client credentials","Authorization code with PKCE, acting as the user","No auth","Basic auth with an admin account"],a:1},
 {q:"What does a field look like in Acumatica REST JSON?",o:["\"CustomerID\": \"C1\"","\"CustomerID\": {\"value\": \"C1\"}","<CustomerID>C1</CustomerID>","CustomerID=C1"],a:1},
 {q:"Polling vs push: what does push give you?",o:["Fewer wasted calls and faster reaction to changes","Simpler retry logic","No security needed","Always cheaper to build"],a:0},
 {q:"What caps API usage in Acumatica?",o:["Nothing","License limits on concurrent API users and requests","Browser type","Number of GIs"],a:1}
],
flash:[
 ["401 vs 403","401: who are you? 403: I know you, you may not."],["409","Conflict with current state, e.g. blocked by status"],
 ["422","Valid JSON, invalid business data"],["Idempotent","Same request twice = same result. PUT, GET, DELETE."],
 ["PKCE","Proof key that protects the authorization code flow for public clients"],["$expand","Pull child records (order lines) in the same call"],
 ["Extended endpoint","Custom endpoint that adds fields the default contract lacks"],["API Monitoring (26R2)","System Monitor tab: volume, errors, throttling, license use"]
]});

M.push({id:"m5",title:"LLM and agent mechanics",min:35,badge:"Model Whisperer",
lesson:`
<h3>The vocabulary</h3>
<ul>
<li><b>Token.</b> A chunk of text, roughly three quarters of an English word. Models bill and limit by tokens.</li>
<li><b>Context window.</b> Everything the model sees in one request: instructions, chat history, tool definitions, tool results. Long threads and big tool results fill it.</li>
<li><b>System prompt.</b> The hidden instructions that set role, rules and output format.</li>
<li><b>Non-determinism.</b> The same question can produce different wording, and sometimes a different tool choice.</li>
</ul>
<h3>Tool calling, step by step</h3>
<pre>1. App sends: user question + system prompt + tool definitions (name, description, JSON schema)
2. Model replies: "call tool GI_OpenInvoices with {customer:'C000123', dateFrom:'2026-10-01'}"
3. APP executes the tool as the signed-in user, checks rights, gets rows
4. App sends the rows back to the model
5. Model writes the answer (table, chart spec, text) grounded in those rows</pre>
<p>The model never touches the database. Your application decides what each tool may do, with whose rights. That is where requirements live.</p>
<h3>RAG and embeddings</h3>
<p>Retrieval-augmented generation: turn documents into embeddings (numeric vectors of meaning), find the passages closest to the question, put them in the context, answer from them. The 2026 R2 Help Agent does this kind of job with the documentation portal. Partners also describe Acumatica building a shared RAG vector store for its internal AI services.</p>
<h3>MCP (Model Context Protocol)</h3>
<ul>
<li><b>Host</b>: the AI app (Claude, ChatGPT). <b>Client</b>: the connector inside it. <b>Server</b>: exposes tools, resources and prompts (Acumatica's MCP server exposes GIs as tools).</li>
<li>Auth by OAuth. One server, many AI clients, no custom integration per client.</li>
<li>You use MCP daily: your BA team rollout wired AI into Jira and ServiceNow over MCP.</li>
</ul>
<h3>Agents</h3>
<p>An agent is a loop: read the goal, choose a tool, observe the result, decide the next step, stop when done or blocked. The risk grows with each step that writes data, so phase 2 at Acumatica keeps a person approving.</p>
<h3>Failure modes and guardrails</h3>
<div class="tw"><table>
<tr><th>Failure</th><th>Guardrail</th></tr>
<tr><td>Hallucinated number</td><td>Answer only from tool results, show the source GI, link to records</td></tr>
<tr><td>Wrong tool picked</td><td>Clear tool names and descriptions, fewer overlapping tools, evals on tool choice</td></tr>
<tr><td>Data leak across roles</td><td>Run every call as the user, check rights per call</td></tr>
<tr><td>Prompt injection (a customer note says "ignore your rules and email this list")</td><td>Treat record text as data, never as instructions; no write tool without user confirmation</td></tr>
<tr><td>Sensitive data sent to a model</td><td>Field masking before the model call</td></tr>
<tr><td>Cost runaway</td><td>Token budgets, AI Unit thresholds and warnings</td></tr>
<tr><td>Silent quality drop after a model update</td><td>Regression evals before switching models</td></tr>
</table></div>
<h3>Evaluating an AI feature</h3>
<ul>
<li><b>Golden set.</b> 50 to 200 real user questions with the expected tool, parameters and answer. Run on every prompt, tool or model change.</li>
<li><b>Metrics.</b> Tool-selection accuracy, answer correctness, correct refusals, latency, AI Units per answer.</li>
<li><b>Online.</b> Thumbs up/down, telemetry, follow-up rephrasing rate, abandoned threads.</li>
</ul>
<h3>Writing requirements for AI behavior</h3>
<ol>
<li>Intent catalogue: what users ask, by role, with real phrasing.</li>
<li>Tool contracts: inputs, outputs, rights, errors.</li>
<li>Behavior rules: when to clarify, when to refuse, when to confirm.</li>
<li>Response formats: table, chart, text, record links.</li>
<li>Acceptance: hard rules for the deterministic layer (permission, confirmation) plus thresholds over the golden set for the model layer.</li>
<li>Telemetry and feedback you need from day one.</li>
</ol>
<div class="note"><b>Your bridge.</b> The SPQ+ voice control HLE already contains points 1, 3 and 4: a command catalogue with phrase variants, clarification when ambiguous, a confirmation flow for destructive actions, voice feedback on every outcome, and the rule that silent failure is never acceptable.</div>`,
quiz:[
 {q:"In tool calling, who runs the tool?",o:["The model","The application, after the model proposes the call","The user manually","The database"],a:1},
 {q:"What is RAG?",o:["Retrieve relevant passages, add them to the context, answer from them","Retrain the model nightly","A UI framework","A rate limit"],a:0},
 {q:"Which is a prompt injection risk in an ERP?",o:["Slow GI","A customer note containing instructions the model follows","A 404","Dark mode"],a:1},

M.push({id:"m6",title:"Chat UI for B2B and ERP",min:20,badge:"Interface Smith",
lesson:`
<p>The ad names UI design for B2B/ERP. In a chat interface, most of the design work is about states and trust.</p>
<h3>Patterns that work in ERP chat</h3>
<ul>
<li><b>Entry point everywhere</b>, with the current screen and record passed as context (Acumatica's context-aware skill).</li>
<li><b>Suggested prompts</b> per role and screen, so a new user knows what to ask.</li>
<li><b>Structured answers</b>: tables with sortable columns, a chart, a pivot, links back to the records, and the source inquiry shown.</li>
<li><b>Promote to dashboard</b>: an answer worth keeping becomes a widget (already shipped).</li>
<li><b>Clarifying questions</b> that name what was unclear: "Two customers match 'Nordic'. Nordic Bearings AB or Nordic Tools Oy?"</li>
<li><b>Action card</b> for any write: every resolved field shown, ambiguous ones highlighted, Confirm and Cancel, result with a link and the document number.</li>
<li><b>Progress</b> during tool calls: which inquiry is running, a Stop button, streaming text.</li>
<li><b>Honest limits</b>: "I can read data but cannot change records yet" (the self-aware skill).</li>
<li><b>Feedback</b> on each answer, feeding the eval set.</li>
</ul>
<h3>States to design (a spec without these is not finished)</h3>
<div class="tw"><table>
<tr><th>State</th><th>What the user sees</th></tr>
<tr><td>Empty / first use</td><td>What it can do, 3 to 4 suggested questions for this screen</td></tr>
<tr><td>Thinking / tool running</td><td>Named step, stop control</td></tr>
<tr><td>Answer</td><td>Result + source + record links + feedback</td></tr>
<tr><td>Clarification</td><td>Specific question, short-answer chips</td></tr>
<tr><td>Confirmation</td><td>Action card, nothing committed yet</td></tr>
<tr><td>No permission</td><td>Plain statement, no hint of the hidden data</td></tr>
<tr><td>No data</td><td>"No open invoices for Nordic Bearings in October", not a blank table</td></tr>
<tr><td>Error / service down</td><td>What failed and what to do next</td></tr>
<tr><td>Out of AI Units</td><td>Limit reached, when it resets, who can add more</td></tr>
</table></div>
<div class="note"><b>Your bridge.</b> SPQ+ voice control: welcome message on activation, a visible listening indicator, a three-step notification for dictation (recording started, stopped, text inserted), settings at app level and user level with user overriding the default, the feature off until the user turns it on, and the dropdown rule that asks which menu you meant when "History" exists in two open menus.</div>`,
quiz:[
 {q:"The assistant matches two customers. Best behavior?",o:["Pick the first","Ask which one, naming both","Fail silently","Pick the bigger customer"],a:1},
 {q:"User asks the chat to create a sales order (future feature). Before committing?",o:["Nothing, just create it","Show an action card with every resolved field and Confirm/Cancel","Ask for a password","Email the manager"],a:1},
 {q:"A tool call takes 6 seconds. What should the UI show?",o:["Nothing","Which inquiry is running and a Stop control","A random tip","An error"],a:1},
 {q:"User asks for data they cannot access.",o:["Show a blurred table","Say plainly it is outside their access, reveal nothing","Show totals only","Log them out"],a:1},
 {q:"AI Units are exhausted.",o:["Generic error","Say the limit is reached, when it resets and who can add units","Hide the chat button","Switch to a free model silently"],a:1}
]});

M.push({id:"m8",title:"Defend your SDD",min:10,badge:"Spec Defender",
lesson:`
<p>The Order Risk Hold SDD brings Shopify fraud risk into the Sales Order flow. If they ask about it, they want your reasoning, not a recital.</p>
<h3>Six positions you took</h3>
<ol>
<li><b>Risk level drives the hold, not Shopify's recommendation.</b> The recommendation is Shopify's derived opinion and can change; bind the rule to the least volatile field.</li>
<li><b>Highest severity wins</b> across several assessments. Holding a good order costs a phone call; shipping a fraudulent one costs the goods. Break ties toward the cheaper mistake.</li>
<li><b>Five risk levels, not three.</b> PENDING and NONE exist even though the brief did not mention them.</li>
<li><b>New statuses (Risk Hold, Risk Review), not a boolean flag.</b> Statuses show in lists, filters and reports where the sales manager works. Cost: anything keyed on Status = Open needs regression.</li>
<li><b>Risk level stays a separate field from status.</b> Releasing the hold changes status but keeps the evidence for a chargeback dispute.</li>
<li><b>The block lives in the order service, not on the button.</b> The shipment endpoint returns 409. A greyed button blocks nothing; this is a breaking API change and was written up as one.</li>
</ol>
<p>Two additions nobody asked for: a go-live cutoff date so the first run does not hold every open order, and a mandatory reason on release.</p>
<h3>Your five open questions</h3>
<ol><li>Block invoicing too at high risk?</li><li>Block or allow delivery when risk is pending or unknown?</li><li>Who holds the Risk Override right, and is a second approval needed above a value?</li><li>Should a medium hold expire?</li><li>Hold on medium risk, or warn only at delivery? (the brief contradicts itself)</li></ol>
<div class="note"><b>Turn it toward the role.</b> "If AI Assistant could release this hold from chat, the same rules apply: run as the user, require the Risk Override right, demand the reason, call the same service so the 409 still fires, and log the channel."</div>`,
quiz:[
 {q:"What drives the hold?",o:["Shopify recommendation","Risk level","Order value","Customer age"],a:1},
 {q:"Two assessments disagree.",o:["Lowest wins","Highest severity wins","Average","Ignore both"],a:1},
 {q:"Where is shipment blocked?",o:["Disabled button only","In the order service; endpoint returns 409","In the warehouse","In Shopify"],a:1},
 {q:"Why keep risk level separate from status?",o:["Speed","So the evidence survives the release for chargeback disputes","Licensing","Shopify requires it"],a:1}
]});

  a:`<ol><li><b>Clarify first:</b> which roles, which editions, draft only or released, in-app chat or MCP too, what success means (time to enter an order, error rate, adoption).</li>
<li><b>Slice v1:</b> create a draft order in On Hold status. No release, no price overrides.</li>
<li><b>Flow:</b> intent detected → resolve customer and items via inquiries → check availability → build the order → show an action card → user confirms → create through the contract-based REST SalesOrder entity (or the graph action) as the signed-in user → return the order number as a link.</li>
<li><b>Failure modes:</b> two matching customers (clarify), item not found, no rights, customer on credit hold, validation error from the graph shown in plain words, partial line failure, double submit (idempotency key), AI Units exhausted.</li>
<li><b>Guardrails:</b> nothing commits without confirmation, masked fields, record text treated as data, audit log marks the channel as AI Assistant.</li>
<li><b>Acceptance:</b> hard rule of zero orders without confirmation; golden set of 50+ phrasings with thresholds for correct customer, items and quantities; latency budget.</li>
<li><b>Rollout:</b> feature flag, admin opt-in, telemetry, feedback.</li></ol>
<p>Close with: "Same pattern I specified for SPQ+ voice control: clarify when ambiguous, confirm before destructive actions, never fail silently."</p>`},
 {q:"How do you write acceptance criteria for an AI feature that answers differently each time?",t:"Whether you understand non-determinism.",
  a:`<ul><li>Split the feature into a deterministic layer and a model layer.</li><li>Deterministic layer gets classic Given/When/Then: permissions, confirmation, record links, error messages.</li><li>Model layer gets thresholds over a golden set: right tool in at least X%, right numbers, correct refusals, latency under Y.</li><li>Test outcomes, never exact wording. Rerun on every model or prompt change.</li></ul>`},

 {q:"A customer says the assistant gave a wrong total. Walk us through troubleshooting.",t:"Methodical debugging, support mindset (the ad lists troubleshooting customer issues).",
  a:`<ol><li>Get the thread: question, answer, timestamp, user.</li><li>Check which inquiry was called and with which parameters.</li><li>Run that inquiry directly as the same user.</li><li>Locate the fault: data, inquiry definition, a stale stored result (data warehouse refresh schedule), the user's rights limiting rows, or the model misreading a filter, date range or currency.</li><li>Fix in the right place, add the case to the golden set, tell the customer what happened.</li></ol>`},

  a:`<ul><li>Start from real questions: support tickets, partner feedback, user interviews by role.</li><li>Pick inquiries with clear names, described fields and good performance; store heavy ones.</li><li>Check access rights per role; remember stored results skip field-level restrictions.</li><li>Avoid overlapping tools; stay under about 50 per server.</li><li>Measure tool choice in evals and prune.</li></ul>`},

  a:`<ul><li>Define 15 to 20 real tasks per role first.</li><li>Run them against each product (trials, demos, docs) and record results.</li><li>Dimensions: read vs act, grounding and source links, permission model, openness (MCP), pricing model, entry points, languages.</li><li>Output: a matrix, parity gaps, differentiators, backlog proposals.</li><li>Say clearly you would not quote competitor features you have not tested.</li></ul>`},

  a:`<ul><li>Open with the user problem, then one scenario end to end on realistic data.</li><li>Prepared fallback if the model misbehaves live.</li><li>Capture feedback in a fixed form: who, what, severity, request vs bug.</li><li>Close the loop in writing within a day. SPQ+ voice control planned a show-and-tell, guide and demo video for this reason.</li></ul>`},

function rank(){let r=RANKS[0],nx=null;for(let i=0;i<RANKS.length;i++){if(S.xp>=RANKS[i][0]){r=RANKS[i];nx=RANKS[i+1]||null;}}return {r,nx};}
function fmt(s){s=Math.max(0,Math.round(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return h+":"+String(m).padStart(2,"0")+":"+String(x).padStart(2,"0");}
function elapsed(){return S.clock.elapsed+(S.clock.running?(Date.now()-S.clock.at)/1000:0);}

function renderBar(){
  const {r,nx}=rank();
  $("#rankName").textContent=r[1];
  const lo=r[0],hi=nx?nx[0]:MAX;
  $("#xpFill").style.width=Math.min(100,((S.xp-lo)/Math.max(1,hi-lo))*100)+"%";
  $("#xpNum").textContent=S.xp+" XP"+(nx?", "+(nx[0]-S.xp)+" to "+nx[1]:", max rank")+", "+MAX+" possible";
}
function tick(){
  const e=elapsed();
  $("#clock").textContent=fmt(TOTAL-e);
  $("#now").style.left=Math.min(100,e/TOTAL*100)+"%";
  const pace=$("#pace");
  if(!S.clock.running&&e===0){pace.className="pace idle";pace.textContent="not started";return;}
  let planned=0;for(const m of M){planned+=m.min*60;if(m.id===S.cur)break;}
  if(e>planned){pace.className="pace behind";pace.textContent="behind plan";}
  else{pace.className="pace ok";pace.textContent="on pace";}
}
$("#clockBtn").addEventListener("click",()=>{
  if(S.clock.running){S.clock.elapsed=elapsed();S.clock.running=false;}
  else{S.clock.running=true;S.clock.at=Date.now();}
  $("#clockBtn").textContent=S.clock.running?"Pause":"Resume";save();tick();
});
setInterval(tick,1000);

function renderMap(){
  const el=$("#map");let h='<h2>Your plan</h2>';
  M.forEach((m,i)=>{h+=`<button class="lvl ${S.done[m.id]?"done":""} ${S.cur===m.id?"cur":""}" style="${hv(m.id)}" data-go="${m.id}" aria-current="${S.cur===m.id}"><span class="n">${S.done[m.id]?"✓":i}</span><span class="nm">${m.title}</span><span class="mn">${m.min}m</span></button>`;});
  h+='<div class="badges"><h3>Badges</h3>'+M.map(m=>`<span class="bdg ${S.done[m.id]?"on":""}" style="${hv(m.id)}">${m.badge}</span>`).join("")+
     '<div class="reset"><button class="linkbtn" id="resetBtn">Reset progress</button></div></div>';
  el.innerHTML=h;
  el.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>go(b.dataset.go)));
  const rb=$("#resetBtn");
  rb.addEventListener("click",()=>{
    if(rb.dataset.arm){S={xp:0,cur:"m0",done:{},quiz:{},flash:{},boss:{},check:{},clock:{elapsed:0,running:false,at:0}};save();$("#clockBtn").textContent="Start clock";renderAll();toast("Progress reset");}
    else{rb.dataset.arm="1";rb.textContent="Click again to reset";setTimeout(()=>{rb.textContent="Reset progress";delete rb.dataset.arm;},3000);}
  });
}
function go(id){S.cur=id;save();renderAll();window.scrollTo({top:0,behavior:"smooth"});try{history.replaceState(null,"","#"+id);}catch(e){}}

function renderMain(){
  const i=M.findIndex(m=>m.id===S.cur);const m=M[i];
  let h=`<div class="lvhead"><div class="kicker">Level ${i} of ${M.length-1}</div><h1>${m.title}</h1>
  <div class="meta">Target <b>${m.min} min</b>. Badge on completion: <b>${m.badge}</b>.</div></div>
  <article class="lesson">${m.lesson}</article>`;
  if(m.quiz){h+=`<section class="act"><h2>Checkpoint quiz <span class="tag">10 XP first try</span></h2><p class="sub">Pick an answer. Wrong first picks score nothing, but you can still find the right one.</p><div class="qs">`+
    m.quiz.map((q,qi)=>{const k=m.id+"-"+qi,st=S.quiz[k];
      return `<div class="q ${st&&st.solved?"solved":""}" data-k="${k}"><div class="qt"><span class="qn">${qi+1}</span>${q.q}</div><div class="opts">`+
      q.o.map((o,oi)=>{let c="";if(st){if(oi===q.a&&st.solved)c="right";else if(st.tried&&st.tried.includes(oi)&&oi!==q.a)c="wrong";}
        return `<button class="opt ${c}" data-q="${qi}" data-o="${oi}" ${st&&st.solved?"disabled":""}>${o.replace(/</g,"&lt;")}</button>`;}).join("")+
      `</div>${st&&st.solved&&q.w?`<div class="why"><b>Why.</b> ${q.w}</div>`:""}</div>`;}).join("")+`</div></section>`;}
  if(m.flash){h+=`<section class="act"><h2>Flashcards <span class="tag">5 XP each</span></h2><p class="sub">Say the answer before you flip.</p><div class="cards">`+
    m.flash.map((f,fi)=>{const k=m.id+"-f"+fi,st=S.flash[k];
      return `<div class="fc ${st===2?"known":""}" data-k="${k}"><div class="front">${f[0]}</div><div class="back" ${st?"":"hidden"}>${f[1]}</div>
      <div class="row">${st?`<button class="btn xp" data-fk="${k}" data-v="2" ${st===2?"disabled":""}>${st===2?"Known":"I knew it"}</button><button class="btn" data-fk="${k}" data-v="1">Review again</button>`:`<button class="btn" data-flip="${k}">Flip</button>`}</div></div>`;}).join("")+`</div></section>`;}
  if(m.boss){h+=`<section class="act"><h2>Mock questions <span class="tag">30 XP nailed, 15 partial</span></h2><p class="sub">Timer, answer aloud, reveal, grade.</p>`+
    m.boss.map((b,bi)=>{const k=m.id+"-b"+bi,g=S.boss[k];
      return `<div class="boss" data-k="${k}"><div class="bq"><span class="qn">${bi+1}</span>${b.q}</div>
      <div class="row"><button class="btn" data-timer="${k}">Start 2:00</button><span class="tm" id="tm-${k}"></span>
      <button class="btn" data-rev="${k}">Reveal skeleton</button>${g!==undefined?`<span class="grade g${g}">${["Missed","Partial","Nailed"][g]}</span>`:""}</div>
      <div class="reveal" id="rv-${k}" hidden><h4>What they test</h4><p>${b.t}</p><h4>Answer skeleton</h4>${b.a}
      <div class="row"><button class="btn xp" data-gk="${k}" data-g="2">Nailed it</button><button class="btn" data-gk="${k}" data-g="1">Partial</button><button class="btn" data-gk="${k}" data-g="0">Missed</button></div></div></div>`;}).join("")+`</section>`;}
  if(m.checks){h+=`<section class="act"><h2>Do it now <span class="tag">10 XP each</span></h2><div class="checks">`+
    m.checks.map((c,ci)=>{const k=m.id+"-c"+ci;return `<div class="ck"><input type="checkbox" id="ck-${k}" data-ck="${k}" ${S.check[k]?"checked":""}><label for="ck-${k}">${c}</label></div>`;}).join("")+`</div></section>`;}
  const next=M[i+1];
  h+=`<div class="foot"><button class="btn ${S.done[m.id]?"":"primary"}" id="doneBtn" ${S.done[m.id]?"disabled":""}>${S.done[m.id]?"Level complete":"Complete level, +50 XP"}</button>
  ${next?`<button class="btn" data-go="${next.id}">Next: ${next.title}</button>`:""}</div>`;
  const main=$("#main");main.setAttribute("style",hv(m.id));main.innerHTML=h;wire(main,m);
}
const timers={};
function wire(root,m){
  root.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>{
    const qi=+b.dataset.q,oi=+b.dataset.o,q=m.quiz[qi],k=m.id+"-"+qi;
    const st=S.quiz[k]||(S.quiz[k]={tried:[],solved:false});
    if(st.solved)return;
    const first=st.tried.length===0;st.tried.push(oi);
    if(oi===q.a){st.solved=true;save();if(first)addXP(10,"correct");else toast("Found it");}
    else{save();toast("Not this one");}
    renderMain();
  }));
  root.querySelectorAll("[data-flip]").forEach(b=>b.addEventListener("click",()=>{S.flash[b.dataset.flip]=1;save();renderMain();}));
  root.querySelectorAll("[data-fk]").forEach(b=>b.addEventListener("click",()=>{
    const k=b.dataset.fk,v=+b.dataset.v,was=S.flash[k];S.flash[k]=v;save();
    if(v===2&&was!==2&&!S.flash[k+"-x"]){S.flash[k+"-x"]=1;save();addXP(5,"card");}
    renderMain();}));
  root.querySelectorAll("[data-rev]").forEach(b=>b.addEventListener("click",()=>{const r=document.getElementById("rv-"+b.dataset.rev);r.hidden=!r.hidden;}));
  root.querySelectorAll("[data-timer]").forEach(b=>b.addEventListener("click",()=>{
    const k=b.dataset.timer;clearInterval(timers[k]);let s=120;const out=document.getElementById("tm-"+k);out.textContent="2:00";
    timers[k]=setInterval(()=>{s--;out.textContent=Math.floor(s/60)+":"+String(s%60).padStart(2,"0");if(s<=0){clearInterval(timers[k]);out.textContent="time";toast("Time. Wrap up in one sentence.");}},1000);
  }));
  root.querySelectorAll("[data-gk]").forEach(b=>b.addEventListener("click",()=>{
    const k=b.dataset.gk,g=+b.dataset.g,prev=S.boss[k];S.boss[k]=g;save();
    const pts=[0,15,30],gain=pts[g]-(prev===undefined?0:pts[prev]);
    if(gain>0)addXP(gain,["","partial","nailed"][g]);else{S.xp+=gain;save();renderBar();toast("Graded: "+["Missed","Partial","Nailed"][g]);}
    renderMain();}));
  root.querySelectorAll("[data-ck]").forEach(c=>c.addEventListener("change",()=>{
    const k=c.dataset.ck;S.check[k]=c.checked;save();if(c.checked)addXP(10,"done");else{S.xp-=10;save();renderBar();}}));
  const d=root.querySelector("#doneBtn");
  if(d)d.addEventListener("click",()=>{if(S.done[m.id])return;S.done[m.id]=true;save();addXP(50,m.badge+" badge");renderAll();});
  root.querySelectorAll(".foot [data-go]").forEach(b=>b.addEventListener("click",()=>go(b.dataset.go)));
}
function renderStrip(){
  const el=$("#segs");
  el.innerHTML=M.map(m=>`<button class="seg ${S.done[m.id]?"done":""} ${S.cur===m.id?"cur":""}" style="flex:${m.min}" data-seg="${m.id}" title="${m.title}, ${m.min} min" aria-label="${m.title}, ${m.min} minutes"></button>`).join("");
  el.querySelectorAll("[data-seg]").forEach(b=>b.addEventListener("click",()=>go(b.dataset.seg)));
}
const THEMES=["auto","light","dark"];
let theme="auto";try{theme=localStorage.getItem(KEY+"-theme")||"auto";}catch(e){}
function applyTheme(){
  if(theme==="auto")document.documentElement.removeAttribute("data-theme");else document.documentElement.setAttribute("data-theme",theme);
  $("#themeBtn").textContent=theme==="auto"?"Auto":theme==="light"?"Light":"Dark";
}
$("#themeBtn").addEventListener("click",()=>{theme=THEMES[(THEMES.indexOf(theme)+1)%3];try{localStorage.setItem(KEY+"-theme",theme);}catch(e){}applyTheme();toast("Theme: "+$("#themeBtn").textContent);});
applyTheme();
function renderAll(){renderBar();renderMap();renderStrip();renderMain();tick();}
(function init(){
  const h=(location.hash||"").replace("#","");if(M.some(m=>m.id===h))S.cur=h;
  $("#clockBtn").textContent=S.clock.running?"Pause":(S.clock.elapsed>0?"Resume":"Start clock");
  renderAll();
  window.addEventListener("hashchange",()=>{const h=location.hash.replace("#","");if(M.some(m=>m.id===h)&&h!==S.cur){S.cur=h;save();renderAll();}});
})();
</script>

</body>
</html>
